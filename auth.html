<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#850d24"><title>AL REEM | تسجيل الدخول</title><link rel="icon" href="./assets/gazelle-original.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="./styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js" defer></script><script src="./auth.js" defer></script></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="./index.html"><img class="brand-logo" src="./assets/gazelle-original.svg" alt="AL REEM" width="44" height="44"><span class="brand-copy"><strong>AL REEM</strong><small>رحلتك تبدأ هنا</small></span></a><a class="button button-outline button-small" href="./index.html">الرئيسية / Home</a></div></header><main class="results-page"><div class="container"><section class="account-panel"><span class="section-kicker" data-t="kicker">حساب AL REEM</span><h1 data-t="title">تسجيل الدخول أو إنشاء حساب</h1><p class="muted" data-t="intro">أنشئ حسابًا لمتابعة طلبات السفر الخاصة بك.</p><div class="auth-tabs"><button type="button" class="button button-primary" id="showLogin" data-t="loginTab">تسجيل الدخول</button><button type="button" class="button button-outline" id="showSignup" data-t="signupTab">إنشاء حساب</button><button type="button" class="language-switch" id="languageToggle">EN</button></div><form id="loginForm" class="stack-form"><label class="field"><span data-t="email">البريد الإلكتروني</span><input type="email" name="email" autocomplete="email" required></label><label class="field"><span data-t="password">كلمة المرور</span><input type="password" name="password" autocomplete="current-password" minlength="8" required></label><button class="button button-primary" type="submit" data-t="login">دخول</button></form><form id="signupForm" class="stack-form" hidden><label class="field"><span data-t="name">الاسم الكامل</span><input name="full_name" autocomplete="name" required maxlength="120"></label><label class="field"><span data-t="email">البريد الإلكتروني</span><input type="email" name="email" autocomplete="email" required></label><label class="field"><span data-t="phone">رقم الهاتف (اختياري)</span><input name="phone" autocomplete="tel" maxlength="30"></label><label class="field"><span data-t="password">كلمة المرور</span><input type="password" name="password" autocomplete="new-password" minlength="8" required></label><button class="button button-primary" type="submit" data-t="signup">إنشاء الحساب</button></form><p id="authMessage" class="form-message" role="status" aria-live="polite"></p></section></div></main></body></html>
