<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#850d24"><title>AL REEM | طلب حجز يدوي</title><link rel="icon" href="./assets/gazelle-original.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js" defer></script><script src="./booking.js" defer></script></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="./index.html"><img class="brand-logo" src="./assets/gazelle-original.svg" alt="AL REEM" width="44" height="44"><span class="brand-copy"><strong>AL REEM</strong><small data-t="tag">رحلتك تبدأ هنا</small></span></a><div class="nav-actions"><button class="language-switch" id="languageToggle">EN</button><a class="button button-outline button-small" href="./account.html" data-t="account">حسابي</a></div></div></header><main class="results-page"><div class="container"><section class="account-panel"><span class="section-kicker" data-t="kicker">طلب حجز بمراجعة يدوية</span><h1 data-t="title">إرسال طلب الحجز</h1><p class="muted" data-t="intro">أرسل تفاصيل رحلتك لفريق AL REEM للمراجعة. الإرسال لا يعني إصدار تذكرة أو تأكيد السعر.</p><form id="bookingForm" class="stack-form"><div class="two-fields"><label class="field"><span data-t="from">من</span><input id="origin" name="origin" required maxlength="120"></label><label class="field"><span data-t="to">إلى</span><input id="destination" name="destination" required maxlength="120"></label></div><label class="field"><span data-t="trip">نوع الرحلة</span><select id="tripType" name="tripType"><option value="round_trip" data-t="round">ذهاب وعودة</option><option value="one_way" data-t="oneway">ذهاب فقط</option></select></label><div class="two-fields"><label class="field"><span data-t="depart">تاريخ المغادرة</span><input id="departureDate" name="departureDate" type="date" required></label><label class="field" id="returnWrap"><span data-t="return">تاريخ العودة</span><input id="returnDate" name="returnDate" type="date"></label></div><div class="two-fields"><label class="field"><span data-t="adults">البالغون</span><select name="adults"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option></select></label><label class="field"><span data-t="cabin">درجة السفر</span><select name="cabin"><option value="economy" data-t="economy">اقتصادية</option><option value="business" data-t="business">رجال الأعمال</option><option value="first" data-t="first">الأولى</option></select></label></div><label class="field"><span data-t="note">ملاحظات إضافية (اختياري)</span><textarea name="customerNote" rows="3" maxlength="2000"></textarea></label><p class="form-message" id="bookingMessage" role="status" aria-live="polite"></p><button class="button button-primary" type="submit" data-t="submit">إرسال الطلب</button></form><div id="bookingSuccess" class="results-note" hidden></div></section></div></main></body></html>
